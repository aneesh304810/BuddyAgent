<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Buddy Maestro</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<style>
:root { --needs:#5b8cff; --wants:#b98cff; --fees:#ff7a7a; --family:#ffb547; --sent:#4cc9f0; --save:#3ddc97; --left:#2c355c;
  --spent:#3a4680; }
html[data-theme=light] { --needs:#2f62c9; --wants:#7b5cc4; --fees:#b3261e; --family:#c8862a; --sent:#13799a; --save:#1b7a4b; --left:#e6e3dc;
  --spent:#9db8ae; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 Roboto, "Segoe UI", system-ui, sans-serif; }
header { position:sticky; top:0; z-index:5; background:var(--bg); padding:14px 16px 8px; border-bottom:1px solid var(--line); }
h1 { font-size:20px; margin:0 0 8px; } h2 { font-size:16px; margin:0 0 10px; }
.chips { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; }
.chip { flex:none; border:1px solid var(--line); background:transparent; color:var(--muted); border-radius:999px;
  padding:5px 11px; font:inherit; font-size:13px; cursor:pointer; }
.chip.on { background:var(--accent); color:var(--onaccent); border-color:var(--accent); font-weight:600; }
main { padding:12px 16px 60px; max-width:900px; margin:0 auto; }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin:0 0 12px; }
.rowbtn{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:inherit;font:inherit;padding:10px 2px;cursor:pointer}
.rowbtn[disabled]{cursor:default;opacity:1} .rowbtn small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.rowbtn .rv{text-align:right;font-weight:600;font-variant-numeric:tabular-nums} .rowbtn .rb{grid-column:1 / -1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.rowbtn .rb i{display:block;height:6px;border-radius:3px;background:var(--accent, #3987e5)}
button.link{background:none;border:0;color:var(--accent, #3987e5);font:inherit;padding:0;cursor:pointer;text-decoration:underline}
.crumbs{font-size:13px;margin-bottom:8px} table.grid td{font-variant-numeric:tabular-nums}
code{font-size:13px;word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 5px}
ul.plain{list-style:none;margin:6px 0;padding:0;font-size:14px} details summary{cursor:pointer}
table.grid{width:100%;border-collapse:collapse;font-size:14px} table.grid th,table.grid td{text-align:left;vertical-align:top;padding:8px 6px;border-bottom:1px solid var(--line)} table.grid th{color:var(--muted);font-weight:600}
select,input[type=number],input:not([type]){background:var(--bg);color:inherit;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;max-width:100%;margin-top:6px}
.kpis { display:grid; grid-template-columns:repeat(auto-fit, minmax(120px, 1fr)); gap:8px; }
.kpi { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
.kpi b { display:block; font-size:19px; } .kpi span { color:var(--muted); font-size:12px; }
.muted { color:var(--muted); font-size:13px; }
.row { display:flex; align-items:center; gap:10px; padding:7px 0; border-top:1px solid var(--line); cursor:pointer; }
.row:first-of-type { border-top:0; } .row:hover { background:var(--hover); }
.row .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row .name.fixed { flex:0 0 38%; white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; line-height:1.25; }
.row .amt { font-variant-numeric:tabular-nums; white-space:nowrap; }
.row .tag { font-size:11px; padding:1px 7px; border-radius:999px; background:var(--tagbg); color:var(--tagtext); }
.bar { height:8px; border-radius:4px; background:var(--accent); }
.barwrap { flex:1; background:var(--track); border-radius:4px; position:relative; height:8px; }
.tick { position:absolute; top:-3px; width:2px; height:14px; background:var(--tick); opacity:.7; }
.up { color:var(--warn); } .down { color:var(--good); }
.stack { display:flex; height:16px; border-radius:8px; overflow:hidden; margin:8px 0; }
.legend { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12px; color:var(--muted); }
.legend i { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; }
svg text { fill:var(--muted); font-size:11px; }
.sheet { position:fixed; inset:0; background:var(--shade); z-index:10; display:none; }
.sheet.open { display:block; }
.panel { position:absolute; left:0; right:0; bottom:0; top:14%; max-height:none; overflow:auto; background:var(--bg);
  border-radius:16px 16px 0 0; border-top:1px solid var(--line); padding:14px 16px 30px; max-width:900px; margin:0 auto; }
.crumbs { font-size:13px; color:var(--muted); margin-bottom:8px; } .crumbs a { color:var(--accent); cursor:pointer; }
.close { float:right; background:none; border:0; color:var(--text); font-size:22px; cursor:pointer; }
.tx { display:grid; grid-template-columns:72px 1fr auto; gap:8px; padding:7px 0; border-top:1px solid var(--line); font-size:14px; }
.tx small { color:var(--muted); display:block; }
.err { color:var(--bad); padding:20px 0; }
.save { display:flex; gap:10px; padding:8px 0; border-top:1px solid var(--line); }
.save b { color:var(--good); white-space:nowrap; }

/* Security page. Severity colours are status colours: always shown with an icon and a word, never alone. */
:root { --sev-critical:#d03b3b; --sev-high:#ec835a; --sev-medium:#fab219; --sev-low:#8a93b8; --sev-good:#0ca30c;
  --found:#3987e5; --fixed:#199e70; --grid:#262d4d; }
html[data-theme=light] { --sev-low:#898781; --found:#2a78d6; --fixed:#1baf7a; --grid:#e1e0d9; }
.status { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.status b { font-size:17px; }
.btn { border:1px solid var(--accent); background:transparent; color:var(--accent); border-radius:999px; padding:5px 12px;
  font:inherit; font-size:13px; cursor:pointer; } .btn.solid { background:var(--accent); color:var(--onaccent); }
.btn[disabled] { opacity:.5; }
.badge { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; padding:1px 8px 1px 6px;
  border-radius:999px; border:1px solid var(--line); background:var(--bg); white-space:nowrap; }
.badge i { width:9px; height:9px; border-radius:50%; display:inline-block; }
.hot { font-size:11px; font-weight:600; padding:1px 7px; border-radius:999px; border:1px solid var(--sev-critical); }
/* Intelligence page */
.stage { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; white-space:nowrap; }
.stage .steps { display:inline-flex; gap:2px; } .stage .steps i { width:9px; height:9px; border-radius:2px; background:var(--track); display:inline-block; }
.stage .steps i.on { background:var(--accent); }
.rowt { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 10px; padding:9px 0; border-top:1px solid var(--line);
  cursor:pointer; text-align:left; width:100%; background:none; border-left:0; border-right:0; border-bottom:0; color:var(--text); font:inherit; }
.rowt:first-of-type { border-top:0; } .rowt:hover, .rowt:focus-visible { background:var(--hover); outline:none; }
.rowt b { font-size:14.5px; } .rowt small { color:var(--muted); grid-column:1 / -1; }
.num { font-variant-numeric:tabular-nums; white-space:nowrap; font-size:13px; }
.chipk { font-size:11px; padding:1px 7px; border-radius:999px; background:var(--tagbg); color:var(--tagtext); white-space:nowrap; }
.kinds { display:flex; flex-wrap:wrap; gap:5px; margin:6px 0; }
.conv { border:1px solid var(--line); border-radius:12px; padding:11px 12px; margin:8px 0; background:var(--bg); }
.conv h3 { margin:0 0 4px; font-size:15px; line-height:1.3; }
.ai { border-left:3px solid var(--accent); padding:6px 10px; margin:8px 0; background:var(--card); border-radius:0 8px 8px 0; font-size:14px; }
.ai .lbl { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); display:block; margin-bottom:2px; }
.ev { padding:7px 0; border-top:1px solid var(--line); font-size:14px; } .ev:first-child { border-top:0; }
.ev a { color:inherit; } .ev small { color:var(--muted); display:block; }
.sector { display:flex; align-items:center; gap:10px; justify-content:space-between; }
.chart { position:relative; } .chart svg { width:100%; height:auto; display:block; overflow:visible; }
.chart .val { fill:var(--text); font-size:11px; font-variant-numeric:tabular-nums; } svg text { fill:var(--muted); font-size:11px; }
.tip { position:absolute; pointer-events:none; background:var(--bg); border:1px solid var(--line); border-radius:8px;
  padding:6px 9px; font-size:12.5px; box-shadow:0 4px 14px var(--shade); display:none; z-index:3; white-space:nowrap; }
details > summary { cursor:pointer; color:var(--accent); font-size:13px; margin-top:6px; }
h3 { font-size:14px; margin:14px 0 4px; }
.guard { display:flex; gap:10px; padding:8px 0; border-top:1px solid var(--line); } .guard:first-child { border-top:0; }
.guard .mark { flex:none; width:22px; text-align:center; font-weight:700; }
.note { color:var(--muted); font-size:12.5px; margin:8px 0 0; }
.notice { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:var(--card); border:1px solid var(--line);
  border-radius:999px; padding:8px 16px; font-size:14px; display:none; z-index:20; max-width:92%; }
a { color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Maestro</h1>
</header>
<main id="main"><p class="muted">Loading…</p></main>
<div class="notice" id="notice" role="status"></div>
<script src="maestro.js"></script>
</body>
</html>
