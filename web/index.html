<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <title>Buddy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Buddy</h1>
      <span id="conn" class="pill">offline</span>
    </header>

    <section id="log" aria-live="polite"></section>

    <footer>
      <p id="status">Tap the orb and start talking</p>
      <button id="orb" aria-label="Start or stop listening"><span></span></button>
      <div class="modes">
        <label><input type="radio" name="mode" value="talk" checked> Talk to Buddy</label>
        <label><input type="radio" name="mode" value="listen"> Listen-in</label>
      </div>
      <label class="toggle" id="handsfreeRow">
        <input type="checkbox" id="handsfree" checked>
        Stay in conversation (hands-free)
      </label>
      <label class="toggle" id="langRow" hidden>
        Room language
        <select id="lang">
          <optgroup label="Languages I don't know — Buddy gives the gist">
            <option value="kn-IN">Kannada</option>
            <option value="te-IN">Telugu</option>
            <option value="bn-IN">Bengali</option>
            <option value="gu-IN">Gujarati</option>
            <option value="pa-IN">Punjabi</option>
            <option value="ur-IN">Urdu</option>
            <option value="ar-SA">Arabic</option>
            <option value="zh-CN">Chinese (Mandarin)</option>
            <option value="ja-JP">Japanese</option>
            <option value="ko-KR">Korean</option>
            <option value="es-ES">Spanish</option>
            <option value="fr-FR">French</option>
            <option value="de-DE">German</option>
            <option value="ru-RU">Russian</option>
            <option value="tl-PH">Filipino</option>
          </optgroup>
          <optgroup label="Languages I know — corrections only">
            <option value="en-IN">English</option>
            <option value="hi-IN">Hindi</option>
            <option value="ml-IN">Malayalam</option>
            <option value="mr-IN">Marathi</option>
            <option value="ta-IN">Tamil</option>
          </optgroup>
        </select>
      </label>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
