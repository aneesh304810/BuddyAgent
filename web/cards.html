<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Buddy · Card benefits</title>
<style>
:root { --bg:#0e1222; --card:#171c33; --line:#262d4d; --text:#eef1ff; --muted:#9aa3c7; --accent:#7aa2ff;
  --good:#3ddc97; --warn:#ffb547; --bad:#ff7a7a; --needs:#5b8cff; --wants:#b98cff; --fees:#ff7a7a;
  --family:#ffb547; --sent:#4cc9f0; --save:#3ddc97; --left:#2c355c;
  --hover:#1c2240; --tagbg:#26305a; --tagtext:#cfd6ff; --track:#20274a; --tick:#fff; --onaccent:#0b1020; --spent:#3a4680;
  --shade:rgba(5,8,20,.6); color-scheme:dark; }
/* Light: the buddylabs.io website's look (white, Buddy green, amber); colours keep 4.5:1 contrast on white */
html[data-theme=light] { --bg:#ffffff; --card:#f6f4ef; --line:#e6e3dc; --text:#16181d; --muted:#5b616e; --accent:#1f6f5c;
  --good:#1b7a4b; --warn:#8a5a12; --bad:#b3261e; --needs:#2f62c9; --wants:#7b5cc4; --fees:#b3261e;
  --family:#c8862a; --sent:#13799a; --save:#1b7a4b; --left:#e6e3dc;
  --hover:#eef6f3; --tagbg:#e5f2ee; --tagtext:#1f6f5c; --track:#ece9e2; --tick:#16181d; --onaccent:#ffffff; --spent:#9db8ae;
  --shade:rgba(22,24,29,.35); color-scheme:light; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 Roboto, "Segoe UI", system-ui, sans-serif; }
header { position:sticky; top:0; z-index:5; background:var(--bg); padding:14px 16px 8px; border-bottom:1px solid var(--line); }
h1 { font-size:20px; margin:0 0 8px; } h2 { font-size:16px; margin:0 0 10px; }
.chips { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; }
.chip { flex:none; border:1px solid var(--line); background:transparent; color:var(--muted); border-radius:999px;
  padding:5px 11px; font:inherit; font-size:13px; cursor:pointer; }
.chip.on { background:var(--accent); color:var(--onaccent); border-color:var(--accent); font-weight:600; }
main { padding:12px 16px 60px; max-width:900px; margin:0 auto; }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin:0 0 12px; }
.kpis { display:grid; grid-template-columns:repeat(auto-fit, minmax(120px, 1fr)); gap:8px; }
.kpi { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
.kpi b { display:block; font-size:19px; } .kpi span { color:var(--muted); font-size:12px; }
.muted { color:var(--muted); font-size:13px; }
.row { display:flex; align-items:center; gap:10px; padding:7px 0; border-top:1px solid var(--line); cursor:pointer; }
.row:first-of-type { border-top:0; } .row:hover { background:var(--hover); }
.row .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row .name.fixed { flex:0 0 38%; white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; line-height:1.25; }
.row .amt { font-variant-numeric:tabular-nums; white-space:nowrap; }
.row .tag { font-size:11px; padding:1px 7px; border-radius:999px; background:var(--tagbg); color:var(--tagtext); }
.bar { height:8px; border-radius:4px; background:var(--accent); }
.barwrap { flex:1; background:var(--track); border-radius:4px; position:relative; height:8px; }
.tick { position:absolute; top:-3px; width:2px; height:14px; background:var(--tick); opacity:.7; }
.up { color:var(--warn); } .down { color:var(--good); }
.stack { display:flex; height:16px; border-radius:8px; overflow:hidden; margin:8px 0; }
.legend { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12px; color:var(--muted); }
.legend i { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; }
svg text { fill:var(--muted); font-size:11px; }
.sheet { position:fixed; inset:0; background:var(--shade); z-index:10; display:none; }
.sheet.open { display:block; }
.panel { position:absolute; left:0; right:0; bottom:0; top:14%; max-height:none; overflow:auto; background:var(--bg);
  border-radius:16px 16px 0 0; border-top:1px solid var(--line); padding:14px 16px 30px; max-width:900px; margin:0 auto; }
.crumbs { font-size:13px; color:var(--muted); margin-bottom:8px; } .crumbs a { color:var(--accent); cursor:pointer; }
.close { float:right; background:none; border:0; color:var(--text); font-size:22px; cursor:pointer; }
.tx { display:grid; grid-template-columns:72px 1fr auto; gap:8px; padding:7px 0; border-top:1px solid var(--line); font-size:14px; }
.tx small { color:var(--muted); display:block; }
.err { color:var(--bad); padding:20px 0; }
.save { display:flex; gap:10px; padding:8px 0; border-top:1px solid var(--line); }
.save b { color:var(--good); white-space:nowrap; }
</style>
<style>
.prog{flex:1;height:8px;border-radius:4px;background:var(--track);overflow:hidden;min-width:60px}
.prog i{display:block;height:100%;background:var(--good)}
.prog.warn i{background:var(--warn)}
.chip2{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--tagbg);color:var(--tagtext);margin-left:6px;vertical-align:middle}
.chip2.warn{background:var(--warn);color:var(--onaccent)}
.credit{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.credit:first-of-type{border-top:0}
.credit .nm{flex:0 0 46%;min-width:0}
.credit .nm b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis}
.credit .nm small{color:var(--muted);font-size:12px}
.credit .rt{white-space:nowrap;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);text-align:right;min-width:86px}
.btn{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}
.btn.solid{background:var(--accent);color:var(--onaccent)}
.worth{position:relative;height:12px;border-radius:6px;background:var(--track);margin:6px 0 4px}
.worth i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--good)}
.worth .fee{position:absolute;top:-4px;width:2px;height:20px;background:var(--text)}
.perks{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.perks span{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--muted)}
.hist{display:flex;gap:8px;align-items:flex-end;height:70px;margin:6px 0}
.hist div{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.hist div i{display:block;background:var(--good);border-radius:4px 4px 0 0;margin:0 auto 3px;width:70%}
.big{font-size:28px;font-weight:700}
</style>
</head>
<body>
<header>
  <h1>Card benefits <span class="muted" id="label"></span></h1>
</header>
<main id="main"><p class="muted">Loading…</p></main>
<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<script src="cards.js"></script>
</body>
</html>
