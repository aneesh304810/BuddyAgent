<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Buddy Prototype</title>

<style>
/* Layout: a review bench. A control strip on top (device, theme, plan, state), the device below it. Inside the
   device: Buddy's app shell built only from the shared tokens (../06-design-system/tokens.css, copied here). */
:root {
  --b-primary:#1F6F5C; --b-primary-strong:#174E41; --b-on-primary:#FFFFFF; --b-primary-soft:#E3F0EA;
  --b-background:#F7F8F6; --b-surface:#FFFFFF; --b-surface-2:#F0F3EF; --b-text:#17211D; --b-text-2:#5E6B63;
  --b-border:#E3E9E4; --b-border-strong:#808C84; --b-success:#1B7A4B; --b-warning:#8A5A12; --b-critical:#B3261E;
  --b-info:#2F62C9; --b-listening:#0B7A83; --b-speaking:#9A5300; --b-thinking:#6B4FBB; --b-approval:#9C3D6B;
  --b-success-soft:#E4F3EA; --b-warning-soft:#FBF0DC; --b-critical-soft:#FBE7E5; --b-info-soft:#E7EEFB;
  --b-approval-soft:#F7E6EF; --b-scrim:#17211D66; --bench:#E9ECE8; --frame:#2A322D;
  --b-font: Inter, "Segoe UI", system-ui, sans-serif;
  --b-shadow: 0 4px 12px rgba(23,33,29,.08); --b-shadow-3: 0 12px 32px rgba(23,33,29,.16);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --b-primary:#75B99A; --b-primary-strong:#9BD0B6; --b-on-primary:#0D1A14; --b-primary-soft:#1F3329;
  --b-background:#101713; --b-surface:#19221C; --b-surface-2:#222D25; --b-text:#F2F5F1; --b-text-2:#A6B1A9;
  --b-border:#303D34; --b-border-strong:#6E7D74; --b-success:#6FCF97; --b-warning:#F2B65A; --b-critical:#FF8A80;
  --b-info:#8FB0FF; --b-listening:#5BC8CF; --b-speaking:#F5A85B; --b-thinking:#B9A3FF; --b-approval:#E894BD;
  --b-success-soft:#1C3326; --b-warning-soft:#3A2E17; --b-critical-soft:#3D2020; --b-info-soft:#1E2A45;
  --b-approval-soft:#3A2230; --b-scrim:#000000AA; --bench:#0A0F0C; --frame:#3A453E; color-scheme:dark; } }
:root[data-theme="dark"] {
  --b-primary:#75B99A; --b-primary-strong:#9BD0B6; --b-on-primary:#0D1A14; --b-primary-soft:#1F3329;
  --b-background:#101713; --b-surface:#19221C; --b-surface-2:#222D25; --b-text:#F2F5F1; --b-text-2:#A6B1A9;
  --b-border:#303D34; --b-border-strong:#6E7D74; --b-success:#6FCF97; --b-warning:#F2B65A; --b-critical:#FF8A80;
  --b-info:#8FB0FF; --b-listening:#5BC8CF; --b-speaking:#F5A85B; --b-thinking:#B9A3FF; --b-approval:#E894BD;
  --b-success-soft:#1C3326; --b-warning-soft:#3A2E17; --b-critical-soft:#3D2020; --b-info-soft:#1E2A45;
  --b-approval-soft:#3A2230; --b-scrim:#000000AA; --bench:#0A0F0C; --frame:#3A453E; color-scheme:dark; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bench); color:var(--b-text); font:400 15px/1.45 var(--b-font); }
button, input, select { font:inherit; color:inherit; }
button { cursor:pointer; }
:focus-visible { outline:2px solid var(--b-primary); outline-offset:2px; }
.bench { padding-block:16px 40px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:grid; gap:14px; justify-items:center; }
.controls { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; justify-content:center; max-width:980px; }
.controls h1 { font:600 15px/1 var(--b-font); margin:0 8px 0 0; display:flex; align-items:center; gap:8px; }
.seg { display:inline-flex; border:1px solid var(--b-border-strong); border-radius:999px; overflow:hidden; }
.seg button { border:0; background:transparent; padding:5px 11px; font-size:13px; color:var(--b-text-2); min-height:32px; }
.seg button[aria-pressed="true"] { background:var(--b-primary); color:var(--b-on-primary); }
.seg-label { font-size:12px; color:var(--b-text-2); }
.note { font-size:12.5px; color:var(--b-text-2); text-align:center; max-width:720px; }

/* the device */
.device { border:10px solid var(--frame); border-radius:34px; overflow:hidden; background:var(--b-background); position:relative;
  width:412px; max-width:100%; height:860px; box-shadow:var(--b-shadow-3); }
.device.open { width:900px; height:820px; border-radius:26px; }
.app { position:absolute; inset:0; display:grid; grid-template-rows:auto 1fr auto; background:var(--b-background); }
.device.open .app { grid-template-columns:80px 1fr auto; grid-template-rows:1fr; }
.status { height:26px; display:flex; justify-content:space-between; align-items:center; padding:0 18px; font-size:12px; color:var(--b-text-2); }

/* header and sections */
.main { display:grid; grid-template-rows:auto auto 1fr auto; min-height:0; min-width:0; }
.hdr { display:flex; align-items:center; gap:10px; padding:4px 16px 8px; min-height:52px; }
.hdr h2 { font:500 22px/28px var(--b-font); margin:0; flex:1; min-width:0; }
.hdr .brand { display:flex; align-items:center; gap:8px; flex:1; }
.icon-btn { width:44px; height:44px; border-radius:50%; border:0; background:var(--b-surface-2); display:grid; place-items:center; position:relative; flex:none; }
.icon-btn .count { position:absolute; top:6px; right:6px; min-width:16px; height:16px; border-radius:8px; background:var(--b-approval); color:#fff; font-size:10px; display:grid; place-items:center; padding:0 4px; }
.pillbtn { border:1px solid var(--b-border-strong); background:var(--b-surface); border-radius:999px; padding:8px 12px; min-height:40px; display:inline-flex; gap:6px; align-items:center; font-size:13.5px; font-weight:500; }
.segctl { display:flex; gap:6px; padding:0 16px 10px; overflow-x:auto; scrollbar-width:none; }
.segctl button { flex:none; border:1px solid var(--b-border); background:var(--b-surface); color:var(--b-text-2); border-radius:999px; padding:7px 13px; font-size:13.5px; font-weight:500; min-height:36px; }
.segctl button[aria-current="page"] { background:var(--b-text); color:var(--b-background); border-color:var(--b-text); }
.body { overflow:auto; min-height:0; padding:0 16px 16px; display:grid; gap:12px; align-content:start; }
.device.open .body { padding:0 24px 24px; }
.banner { display:flex; gap:8px; align-items:center; margin:0; padding:8px 12px; border-radius:12px; background:var(--b-primary-soft); color:var(--b-text); font-size:12.5px; }

/* building blocks */
.card { background:var(--b-surface); border:1px solid var(--b-border); border-radius:20px; padding:14px 16px; display:grid; gap:8px; min-width:0; }
.card h3 { font:500 15px/20px var(--b-font); margin:0; display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
.card h3 small { font-size:12px; color:var(--b-text-2); font-weight:400; }
.muted { color:var(--b-text-2); font-size:13px; }
.tiles { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:10px; }
.device.open .tiles { grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); }
.tile { background:var(--b-surface); border:1px solid var(--b-border); border-radius:16px; padding:12px; display:grid; gap:2px; }
.tile b { font:500 22px/28px var(--b-font); font-variant-numeric:tabular-nums; }
.tile span { font-size:12.5px; color:var(--b-text-2); }
.row { display:flex; align-items:center; gap:10px; min-height:48px; border-top:1px solid var(--b-border); padding:6px 0; }
.row:first-of-type { border-top:0; }
.row .grow { flex:1; min-width:0; }
.row .grow small { display:block; color:var(--b-text-2); font-size:12.5px; }
.num { font-variant-numeric:tabular-nums; font-weight:500; white-space:nowrap; }
.chip { display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:500; border-radius:999px; padding:2px 9px; border:1px solid currentColor; white-space:nowrap; }
.chip.good { color:var(--b-success); background:var(--b-success-soft); border-color:transparent; }
.chip.warn { color:var(--b-warning); background:var(--b-warning-soft); border-color:transparent; }
.chip.bad { color:var(--b-critical); background:var(--b-critical-soft); border-color:transparent; }
.chip.info { color:var(--b-info); background:var(--b-info-soft); border-color:transparent; }
.chip.appr { color:var(--b-approval); background:var(--b-approval-soft); border-color:transparent; }
.chip.prem { color:var(--b-primary); background:var(--b-primary-soft); border-color:transparent; }
.example { font-size:10.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--b-text-2); }
.btn { border:0; border-radius:999px; padding:10px 16px; min-height:44px; font-weight:500; background:var(--b-primary); color:var(--b-on-primary); }
.btn.quiet { background:var(--b-surface-2); color:var(--b-text); }
.btn.danger { background:var(--b-critical); color:#fff; }
.btn.line { background:transparent; border:1px solid var(--b-border-strong); color:var(--b-text); }
.btns { display:flex; flex-wrap:wrap; gap:8px; }
.bar { height:8px; border-radius:4px; background:var(--b-surface-2); overflow:hidden; }
.bar i { display:block; height:100%; background:var(--b-primary); border-radius:4px; }
details.rests { border-top:1px dashed var(--b-border); padding-top:6px; }
details.rests summary { cursor:pointer; font-size:12.5px; color:var(--b-text-2); list-style:none; display:flex; gap:6px; align-items:center; min-height:32px; }
details.rests summary::-webkit-details-marker { display:none; }
details.rests dl { margin:4px 0 0; display:grid; grid-template-columns:auto 1fr; gap:3px 10px; font-size:12.5px; }
details.rests dt { color:var(--b-text-2); } details.rests dd { margin:0; }
.qa { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:8px; }
.device.open .qa { grid-template-columns:repeat(3, minmax(0, 1fr)); }
.qa button { border:1px solid var(--b-border); background:var(--b-surface); border-radius:16px; min-height:64px; display:grid; place-items:center; gap:2px; padding:8px 4px; font-size:12.5px; font-weight:500; }
.qa button svg { color:var(--b-primary); }

/* conversation */
.greet { font:500 24px/32px var(--b-font); margin:4px 0 0; }
.msgs { display:grid; gap:10px; align-content:end; }
.msg { max-width:86%; padding:10px 13px; border-radius:18px; font-size:14.5px; }
.msg.me { margin-left:auto; background:var(--b-primary); color:var(--b-on-primary); border-bottom-right-radius:6px; }
.msg.bud { background:var(--b-surface); border:1px solid var(--b-border); border-bottom-left-radius:6px; }
.rich { max-width:100%; }
.composer { padding:8px 12px 10px; display:grid; gap:8px; background:var(--b-background); border-top:1px solid var(--b-border); }
.suggest { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; }
.suggest button { flex:none; border:1px solid var(--b-border); background:var(--b-surface); border-radius:999px; padding:6px 12px; font-size:13px; min-height:36px; }
.cbox { display:flex; align-items:center; gap:8px; background:var(--b-surface); border:1px solid var(--b-border-strong); border-radius:28px; padding:4px 4px 4px 6px; }
.cbox input { flex:1; min-width:0; border:0; background:transparent; padding:10px 4px; font-size:15.5px; outline:none; }
.mic { width:48px; height:48px; border-radius:50%; border:0; background:var(--b-primary); color:var(--b-on-primary); display:grid; place-items:center; flex:none; position:relative; }
.mic.listening { background:var(--b-listening); } .mic.thinking { background:var(--b-thinking); } .mic.speaking { background:var(--b-speaking); }
.mic.error { background:var(--b-critical); }
.mic.listening::after { content:""; position:absolute; inset:-5px; border-radius:50%; border:2px solid var(--b-listening); animation:ring 1.2s ease-out infinite; }
@keyframes ring { from { transform:scale(.9); opacity:1; } to { transform:scale(1.25); opacity:0; } }
@media (prefers-reduced-motion: reduce) { .mic.listening::after { animation:none; } }
.vstate { display:flex; align-items:center; gap:8px; font-size:13px; min-height:28px; }
.vdot { width:10px; height:10px; border-radius:50%; background:var(--b-border-strong); }
.vstate.listening .vdot { background:var(--b-listening); } .vstate.thinking .vdot { background:var(--b-thinking); }
.vstate.speaking .vdot { background:var(--b-speaking); } .vstate.error .vdot, .vstate.interrupted .vdot { background:var(--b-critical); }
.modes { display:flex; gap:6px; margin-left:auto; }
.modes button { border:1px solid var(--b-border); background:var(--b-surface); border-radius:999px; padding:3px 9px; font-size:12px; min-height:32px; white-space:nowrap; }
.vstate > span:nth-child(2) { flex:1; min-width:0; }
.modes button[aria-pressed="true"] { border-color:var(--b-primary); color:var(--b-primary); background:var(--b-primary-soft); }
table.cmp { width:100%; border-collapse:collapse; font-size:13px; }
table.cmp th, table.cmp td { text-align:left; padding:6px 4px; border-top:1px solid var(--b-border); vertical-align:top; }
table.cmp th { color:var(--b-text-2); font-weight:500; }
.map { height:120px; border-radius:14px; background:linear-gradient(135deg, var(--b-surface-2) 25%, var(--b-primary-soft) 25% 50%, var(--b-surface-2) 50% 75%, var(--b-primary-soft) 75%); background-size:28px 28px; position:relative; }
.map i { position:absolute; width:22px; height:22px; border-radius:50% 50% 50% 0; transform:rotate(-45deg); background:var(--b-primary); color:var(--b-on-primary); font:600 11px/22px var(--b-font); text-align:center; }
.map i span { display:inline-block; transform:rotate(45deg); }

/* approval */
.approval { border:1.5px solid var(--b-approval); background:var(--b-surface); border-radius:20px; padding:14px 16px; display:grid; gap:8px; }
.approval .what { font:500 17px/24px var(--b-font); }
.approval dl { margin:0; display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:13.5px; }
.approval dt { color:var(--b-text-2); } .approval dd { margin:0; font-variant-numeric:tabular-nums; }

/* navigation */
.nav { display:grid; grid-template-columns:repeat(5, 1fr); background:var(--b-surface); border-top:1px solid var(--b-border); padding:6px 4px 10px; }
.nav button { border:0; background:transparent; display:grid; justify-items:center; gap:3px; font-size:11.5px; font-weight:500; color:var(--b-text-2); min-height:56px; padding:4px 0; }
.nav button .pip { width:56px; height:30px; border-radius:15px; display:grid; place-items:center; }
.nav button[aria-current="page"] { color:var(--b-text); }
.nav button[aria-current="page"] .pip { background:var(--b-primary-soft); color:var(--b-primary); }
.device.open .nav { grid-template-columns:1fr; grid-template-rows:repeat(5, auto); align-content:start; border-top:0; border-right:1px solid var(--b-border); padding:12px 4px; gap:8px; grid-row:1; grid-column:1; }
.device.open .main { grid-column:2; grid-row:1; }
.side { display:none; }
.device.open .side { display:grid; grid-column:3; grid-row:1; width:360px; border-left:1px solid var(--b-border); background:var(--b-surface); grid-template-rows:auto 1fr; min-height:0; }
.side .sbody { overflow:auto; padding:0 16px 16px; display:grid; gap:12px; align-content:start; }
.side .shdr { display:flex; align-items:center; gap:8px; padding:14px 16px 10px; }
.side .shdr h3 { font:500 17px/24px var(--b-font); margin:0; flex:1; }

/* sheets (folded) */
.scrim { position:absolute; inset:0; background:var(--b-scrim); display:flex; align-items:flex-end; z-index:5; }
.sheet { width:100%; max-height:88%; background:var(--b-surface); border-radius:24px 24px 0 0; display:grid; grid-template-rows:auto 1fr; box-shadow:var(--b-shadow-3); }
.sheet .grab { width:36px; height:4px; border-radius:2px; background:var(--b-border-strong); margin:8px auto 0; }
.sheet .shdr { display:flex; align-items:center; gap:8px; padding:8px 16px 6px; }
.sheet .shdr h3 { font:500 17px/24px var(--b-font); margin:0; flex:1; }
.sheet .sbody { overflow:auto; padding:0 16px 20px; display:grid; gap:12px; align-content:start; }
.field { display:grid; gap:4px; font-size:13px; color:var(--b-text-2); }
.field input, .field select { border:1px solid var(--b-border-strong); background:var(--b-surface); border-radius:12px; padding:10px 12px; font-size:16px; color:var(--b-text); min-height:48px; }
.fields { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:8px; }
.cam { height:200px; border-radius:16px; background:linear-gradient(135deg, #26302A, #151B17); display:grid; place-items:center; color:#DCE3DE; font-size:13px; position:relative; }
.cam::after { content:""; position:absolute; inset:46px 60px; border:2px solid rgba(255,255,255,.75); border-radius:12px; }
.toast { position:absolute; left:50%; bottom:110px; transform:translateX(-50%); background:var(--b-text); color:var(--b-background); padding:10px 16px; border-radius:14px; font-size:13.5px; z-index:9; max-width:86%; box-shadow:var(--b-shadow-3); }
.skel { height:64px; border-radius:16px; background:linear-gradient(90deg, var(--b-surface-2), var(--b-surface), var(--b-surface-2)); background-size:200% 100%; animation:sh 1.2s linear infinite; }
@keyframes sh { to { background-position:-200% 0; } }
@media (prefers-reduced-motion: reduce) { .skel { animation:none; } }
.empty { text-align:center; padding:28px 12px; display:grid; gap:10px; justify-items:center; }
.empty svg { color:var(--b-text-2); }
.spark { width:100%; height:44px; }
.spark path { fill:none; stroke:var(--b-primary); stroke-width:2; }
.spark .b { stroke:var(--b-thinking); stroke-dasharray:4 3; }
.lock { color:var(--b-primary); }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
@media (max-width:440px) { .device { border-width:0; border-radius:0; width:100%; height:100svh; } .bench { padding:0; } .controls, .note { padding:8px 12px 0; } }
</style>

// ---------------------------------------------------------------- rendering helpers
const sec = () => S.section[S.dest];
const card = (title, body, small = "") => `<section class="card"><h3>${title}${small ? `<small>${small}</small>` : ""}</h3>${body}</section>`;
const tile = (v, l) => `<div class="tile"><b>${v}</b><span>${l}</span></div>`;
const row = (title, sub, right = "", act = "") => `<div class="row"${act ? ` data-act="${act}" role="button" tabindex="0" style="cursor:pointer"` : ""}><div class="grow">${title}${sub ? `<small>${sub}</small>` : ""}</div>${right}</div>`;
const rests = (pairs, label = "What this rests on") => `<details class="rests"><summary>${ic("info", 16)} ${label}</summary><dl>${pairs.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl></details>`;
const spark = (pts, pts2) => { const path = (a) => a.map((v, i) => `${i ? "L" : "M"}${(i / (a.length - 1) * 100).toFixed(1)} ${(40 - (v - Math.min(...a, ...(pts2 || []))) / (Math.max(...a, ...(pts2 || [])) - Math.min(...a, ...(pts2 || [])) || 1) * 36).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 100 44" preserveAspectRatio="none" aria-hidden="true"><path d="${path(pts)}" vector-effect="non-scaling-stroke"/>${pts2 ? `<path class="b" d="${path(pts2)}" vector-effect="non-scaling-stroke"/>` : ""}</svg>`; };
const premium = (what) => S.plan === "premium" ? "" : `<div class="row"><div class="grow"><span class="chip prem">${ic("spark", 12)} Premium</span> ${esc(what)}<small>Free plan: the basics are here; Premium adds more.</small></div><button class="btn line" data-act="sheet:plans">See plans</button></div>`;

function stateBody(dest) {

  const E = { home: ["Say hello to Buddy", "Ask anything, or try a suggestion below. Buddy keeps your conversations on your own server.", ""],
    health: ["Nothing logged yet", "Log a meal or a blood pressure reading, or connect your ring or phone health data.", "sheet:bp|Log blood pressure"],
    money: ["Connect your bank to begin", "Balances, bills and spending appear once a bank is linked. Buddy can read; it never moves money without your approval.", "go:profile:connections|Connect a bank"],
    explore: ["Pick topics you care about", "News, deals and research follow your topics. Choose a few to start.", "toast:Topics picker (not in this prototype)|Choose topics"],
    profile: ["", "", ""] }[dest];

// ---------------------------------------------------------------- behaviour
let toastTimer;
function toast(t) { S.toast = t; clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = ""; render(); }, 2600); }
function reply(text) {
  const t = text.toLowerCase();
  if (/blood pressure|\bbp\b|cholesterol|weight|calorie|ate |meal|sugar level|heart|health|medicine/.test(t)) return { who: "bud", card: { type: "health" } };
  if (/pay|transfer|card bill/.test(t)) { if (!S.approvals.length) S.approvals.push({ ...APPROVAL0, id: "a" + Date.now() }); return { who: "bud", text: "Here is exactly what I'll do. Nothing happens until you approve.", card: { type: "approval", id: S.approvals[0].id } }; }
