# Buddy's specialist agents. Copy to agents.yaml (path set by BUDDY_AGENTS).
# Every agent is an MCP server, started by Buddy (command) or already running (url).
#
#   name               letters, digits, - and single _ (Claude sees tools as <name>__<tool>)
#   command | url      stdio subprocess, or a Streamable HTTP endpoint on your private server
#   enabled            false keeps it off; you can also switch agents via /admin/agents
#   url_env, token_env names of settings in /etc/buddy/buddy.env holding a secret URL / token
#   env_from           settings from /etc/buddy/buddy.env passed to a command agent
#   approval_required  tool names (or "*") that do nothing until you say "yes"
#   no_approval_for    tool-name patterns that never need a yes (read-only lookups)
#   daily_call_limit   calls per 24 hours before Buddy stops calling it
#   monthly_call_limit calls per 30 days (optional; for services billed per call)

agents:
  - name: worldclock
    description: Time around the world and countdowns to dates.
    command: [".venv/bin/python", "-m", "agents.worldclock.server"]
    enabled: true
    approval_required: []
    daily_call_limit: 200

  # Gmail: read, write and clean up every Gmail account, with the same app passwords
  # as the email connector (BUDDY_EMAIL_ADDRESS..., BUDDY_EMAIL_2_ADDRESS...). Looking,
  # reading and saving drafts run straight away; sending and every cleanup action ask first.
  - name: gmail
    description: Search, read, draft, send and clean up Gmail.
    command: [".venv/bin/python", "-m", "agents.gmail.server"]
    env_from: ["BUDDY_EMAIL_*"]
    enabled: true
    approval_required: ["*"]
    no_approval_for: [search_mail, read_mail, inbox_summary, unsubscribe_links, create_draft, list_accounts]
    daily_call_limit: 300

  # Zapier: thousands of everyday apps (Notion, Todoist, Sheets, Slack...) through
  # Zapier MCP. Set ZAPIER_MCP_URL in /etc/buddy/buddy.env (see docs/ZAPIER.md);
  # until then Buddy skips it. Every action that changes something asks you first;
  # finds, searches and lookups don't.
  - name: zapier
    description: Everyday apps through Zapier (Notion, Todoist, Google Sheets, Slack...).
    url_env: ZAPIER_MCP_URL
    token_env: ZAPIER_MCP_TOKEN          # only if Zapier gave you a separate API key
    enabled: true
    approval_required: ["*"]
    no_approval_for: ["*_find_*", "*_search*", "*_lookup*", "*_get_*", "*_list_*", "*_retrieve*"]
    daily_call_limit: 20
    monthly_call_limit: 45               # Zapier free plan: 100 tasks = about 50 calls a month

  # Phase 1 adds the money agent here, for example:
  # - name: money
  #   description: Card bills, expenses and spending limits.
  #   command: [".venv/bin/python", "-m", "agents.money.server"]
  #   approval_required: ["mark_bill_paid"]
  #   daily_call_limit: 500
